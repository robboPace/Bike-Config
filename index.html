
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pace Atelier Bike Configurator</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #f7f7f7;
    color: #222;
}

header {
    height: 75px;
    padding: 0 5%;
    display: flex;
    justify-content: center;
    align-items: center;
    background: white;
    border-bottom: 1px solid #eee;
}

header h2 {
    font-size: 17px;
    letter-spacing: 2px;
}

.configurator {
    max-width: 1550px;
    margin: 0 auto;
    padding: 45px 35px;
    display: grid;
    grid-template-columns: minmax(0, 1fr) 340px;
    gap: 55px;
    align-items: center;
    min-height: calc(100vh - 75px);
}

.preview-section {
    width: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
}

.preview-heading {
    width: 100%;
    max-width: 1050px;
    display: flex;
    justify-content: space-between;
    margin-bottom: 15px;
    font-size: 12px;
    letter-spacing: 1px;
}

.preview-frame {
    width: 100%;
    max-width: 1050px;
    aspect-ratio: 16 / 9;
    position: relative;
    overflow: hidden;
    background: #e5e5e5;
}

.preview-frame img {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: contain;
    display: none;
    pointer-events: none;
}

.preview-frame img.visible {
    display: block;
}

/* OVERLAY ORDER */

#baseLayer { z-index: 0; }
#layer0 { z-index: 4; }
#layer1 { z-index: 3; }
#layer2 { z-index: 5; }
#layer2b { z-index: 5.5; }
#layer3 { z-index: 1; }
#layer4 { z-index: 2; }
#layer5 { z-index: 6; }

.preview-info {
    width: 100%;
    max-width: 1050px;
    display: flex;
    justify-content: space-between;
    color: #888;
    font-size: 12px;
    margin-top: 12px;
}

.navigation {
    width: 100%;
    max-width: 1050px;
    display: flex;
    justify-content: space-between;
    margin-top: 25px;
}

button {
    padding: 14px 25px;
    border: none;
    background: #222;
    color: white;
    cursor: pointer;
    font-size: 13px;
}

button:disabled {
    opacity: .3;
    cursor: not-allowed;
}

#back {
    background: #ddd;
    color: #222;
}

.selection-panel {
    width: 100%;
    align-self: center;
}

.step-indicator {
    font-size: 11px;
    color: #888;
    letter-spacing: 1px;
    margin-bottom: 12px;
}

.progress {
    display: flex;
    gap: 5px;
    margin-bottom: 30px;
}

.progress span {
    flex: 1;
    height: 3px;
    background: #ddd;
}

.progress span.active {
    background: #222;
}

.selection-panel h1 {
    font-size: 27px;
    margin: 0 0 10px;
}

.description {
    font-size: 13px;
    color: #888;
    margin-bottom: 25px;
}

.options {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 12px;
}

.option {
    background: white;
    border: 2px solid transparent;
    cursor: pointer;
    transition: .2s;
}

.option:hover {
    border-color: #aaa;
}

.option.selected {
    border-color: #222;
}

.option img {
    width: 100%;
    aspect-ratio: 16 / 9;
    object-fit: contain;
    display: block;
}

.option h3 {
    font-size: 13px;
    padding: 0 10px;
    margin-bottom: 5px;
}

.option-price {
    font-size: 12px;
    color: #777;
    padding: 0 10px 12px;
}

/* ROAD / GRAVEL SELECTION */

.bike-type-option {
    background: white;
    border: 2px solid transparent;
    cursor: pointer;
    transition: .2s;
    text-align: center;
}

.bike-type-option:hover {
    border-color: #aaa;
}

.bike-type-option.selected {
    border-color: #222;
}

.bike-type-option h3 {
    font-size: 15px;
    padding: 20px 10px 5px;
}

.bike-type-option p {
    font-size: 12px;
    color: #888;
    padding: 0 10px 15px;
}

/* SELECTION SUMMARY */

.selection-summary {
    margin-top: 30px;
    padding-top: 20px;
    border-top: 1px solid #ddd;
}

.selection-summary h3 {
    font-size: 12px;
    letter-spacing: 1px;
}

.selection-summary p {
    font-size: 12px;
    color: #777;
    margin: 10px 0;
}

.summary-item {
    display: flex;
    justify-content: space-between;
    gap: 10px;
    font-size: 12px;
    color: #777;
    margin: 12px 0;
}

.summary-item span:first-child {
    flex: 1;
}

.summary-item span:last-child {
    white-space: nowrap;
    color: #222;
}

.total-price {
    border-top: 1px solid #ddd;
    margin-top: 18px;
    padding-top: 18px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-size: 12px;
    font-weight: bold;
    letter-spacing: 1px;
}

.total-price strong {
    font-size: 21px;
    letter-spacing: 0;
}

.completion-price {
    font-size: 28px;
    font-weight: bold;
    margin-top: 25px;
}

.empty-options {
    grid-column: 1 / -1;
    background: white;
    padding: 20px;
    font-size: 12px;
    color: #888;
}

@media(max-width: 950px) {
    .configurator {
        grid-template-columns: 1fr;
        gap: 40px;
    }

    .selection-panel {
        max-width: 600px;
        margin: auto;
    }
}

#PaceLogo {
    max-width: 10%;
    padding: 20px;
}

@media(max-width: 600px) {
    #PaceLogo {
        max-width: 25%;
    }

    .configurator {
        padding: 25px 15px;
    }

    .options {
        grid-template-columns: repeat(2, 1fr);
    }
}
</style>
</head>

<body>

<header>
    <img src="paceV11.png" alt="Pace Logo" id="PaceLogo">
    <h2>Bike Configurator</h2>
</header>

<main class="configurator">

    <section class="preview-section">

        <div class="preview-heading">
            <span>LIVE PREVIEW</span>
            <span>1920 × 1080</span>
        </div>

        <div class="preview-frame">

            <img
                class="visible"
                src="BG.png"
                id="baseLayer"
                alt="Base image"
            >

            <img id="layer0" alt="Frame">
            <img id="layer1" alt="Wheels">
            <img id="layer2" alt="Groupset">
            <img id="layer2b" alt="Groupset detail">
            <img id="layer3" alt="Brakes">
            <img id="layer4" alt="Tires">
            <img id="layer5" alt="Saddle">

        </div>

        <div class="preview-info">
            <span>YOUR CONFIGURATION</span>
            <span id="previewStatus">Choose Road or Gravel</span>
        </div>

        <div class="navigation">
            <button id="back" onclick="previousStep()">← BACK</button>
            <button id="next" onclick="nextStep()">CONTINUE →</button>
        </div>

    </section>

    <aside class="selection-panel">

        <div class="step-indicator" id="stepIndicator">
            STEP 01 / 01
        </div>

        <div class="progress" id="progress"></div>

        <div id="stepContent"></div>

        <div class="selection-summary">

            <h3>YOUR SELECTION</h3>

            <div id="selectionList">
                <p>No selections yet</p>
            </div>

            <div class="total-price">
                <span>TOTAL PRICE</span>
                <strong id="totalPrice">€0</strong>
            </div>

        </div>

    </aside>

</main>

<script>

// ======================================
// ROAD CONFIGURATION
// ======================================
//
// FORMAT:
//
// Normal option:
// ["Name", "image.png", PRICE]
//
// Option with TWO images:
// ["Name", "image1.png", "image2.png", PRICE]
//
// Prices are in EUR.
//
// ======================================

const roadSteps = [

    {
        title: "Frame",
        description: "Choose your frame.",
        options: [

            [
                "Quick Pro ER:ONE Shimmering Silver",
                "Quickpro/QP_ERONE_Large/QP_ERONE_ShimmeringSilver.png",
                2299
            ],

            [
                "Quick Pro ER:ONE Twilight Blue",
                "Quickpro/QP_ERONE_Large/QP_ERONE_TwilightBlue.png",
                2299
            ],

            [
                "Quick Pro ER:ONE Vibrant Orange",
                "Quickpro/QP_ERONE_Large/QP_ERONE_VibrantOrange.png",
                2299
            ],

            [
                "Quick Pro Blade",
                "Quickpro/QP_Blade.png",
                1799
            ],

            [
                "Tavelo Arden Race Gloss Black",
                "Tavelo/Tavelo_ArdenRace_GlossBlack.png",
                2295
            ],

            [
                "Tavelo Arden Race Gloss Carbon",
                "Tavelo/Tavelo_ArdenRace_GlossCarbon.png",
                2295
            ],

            [
                "Tavelo Arden Race Gloss Silver Metallic",
                "Tavelo/Tavelo_ArdenRace_GlossSilverMetallic.png",
                2295
            ],

            [
                "Tavelo Arden Race SL Stain Carbon Plaid",
                "Tavelo/Tavelo_ArdenRaceSL_StainCarbonPlaid.png",
                2995
            ],

            [
                "Cannondale SuperSix EVO Hi-MOD Race Yellow",
                "Cannondale/Cannondale_SuperSixEVOHi-MOD_RaceYellow.png",
                4499
            ]

        ]
    },

    {
        title: "Wheels",
        description: "Choose your wheels.",
        options: [

            [
                "Rore Aero ST",
                "Wheels/RoreAeroST.png",
                999
            ],

            [
                "Rore Aero 50",
                "Wheels/RoreAero50.png",
                1399
            ],

            [
                "Rore Aero 60",
                "Wheels/RoreAero60.png",
                1399
            ],

            [
                "Enve AR40",
                "Wheels/EnveAR40.png",
                1648
            ],

            [
                "Enve SES 6.7 Pro",
                "Wheels/EnveSES67PRO.png",
                4598
            ]

        ]
    },

    {
        title: "Groupset",
        description: "Choose your preferred groupset.",
        options: [

            [
                "Sram Rival 2x12",
                "Groupsets/SramRival2x12.png",
                "Quickpro/QP_ERONE_Large/Shifters/SramE1.png",
                0
            ],

            [
                "Sram Force 2x12",
                "Groupsets/SramForce2x12.png",
                "Quickpro/QP_ERONE_Large/Shifters/SramE1.png",
                0
            ],

            [
                "Sram Red 2x12",
                "Groupsets/SramRed2x12.png",
                "Quickpro/QP_ERONE_Large/Shifters/SramE1.png",
                0
            ],

            [
                "Shimano 105 Di2 2x12",
                "Groupsets/Shimano1052x12.png",
                "Quickpro/QP_ERONE_Large/Shifters/ShimanoDi2.png",
                1733
            ],

            [
                "Shimano Ultegra Di2 2x12",
                "Groupsets/ShimanoUltegra2x12.png",
                "Quickpro/QP_ERONE_Large/Shifters/ShimanoDi2.png",
                2491
            ],

            [
                "Shimano Dura Ace Di2 2x12",
                "Groupsets/ShimanoDuraAce2x12.png",
                "Quickpro/QP_ERONE_Large/Shifters/ShimanoDi2.png",
                3897
            ]

        ]
    },

    {
        title: "Brakes",
        description: "Choose your brakes.",
        options: [

            [
                "Sram Force / Rival",
                "Brakes/SramForceRival.png",
                0
            ],

            [
                "Sram Red",
                "Brakes/SramRed.png",
                0
            ],

            [
                "Shimano 105",
                "Brakes/Shimano105.png",
                0
            ],

            [
                "Shimano Ultegra",
                "Brakes/ShimanoUltegra.png",
                0
            ],

            [
                "Shimano Dura Ace",
                "Brakes/ShimanoDuraAce.png",
                0
            ]

        ]
    },

    {
        title: "Tires",
        description: "Choose your preferred tires.",
        options: [

            [
                "Conti GP TR",
                "Tires/ContiGPTR.png",
                129
            ],

            [
                "Conti GP5000 S TR",
                "Tires/ContiGP5000STR.png",
                189
            ]

        ]
    },

    {
        title: "Saddle",
        description: "Choose your saddle.",
        options: [

            [
                "Fizik Argo R5",
                "Quickpro/QP_ERONE_Large/Saddles/FizikArgo.png",
                109
            ]

        ]
    }

];


// ======================================
// GRAVEL CONFIGURATION
// ======================================
//
// Add your Gravel options here.
//
// Use the same format as the Road configuration.
//
// Normal option:
// ["Name", "image.png", PRICE]
//
// Option with TWO images:
// ["Name", "image1.png", "image2.png", PRICE]
//
// The image paths can point to your own
// Gravel folders.
//
// ======================================

const gravelSteps = [

    {
        title: "Frame",
        description: "Choose your gravel frame.",
        options: [

            [
                "Tavelo Grow Black",
                "Tavelo/Tavelo_Grow_Black.png",
                2195
            ],[
                "Tavelo Grow Purple",
                "Tavelo/Tavelo_Grow_Purple.png",
                2195
            ]

        ]
    },

    {
        title: "Wheels",
        description: "Choose your gravel wheels.",
        options: [

            [
                "Rore Gravel 45 Race",
                "Wheels/RoreGravel45Race.png",
                1199
            ],[
                "Pertual Sharp GR",
                "Wheels/PertualSharpGR.png",
                1195
            ]

        ]
    },

    {
        title: "Groupset",
        description: "Choose your gravel groupset.",
        options: [

            [
                "Sram Rival XPLR 1x13",
                "Groupsets/SramRivaelXPLR_Gravel.png",
                0
            ]
        ]
    },

    {
        title: "Brakes",
        description: "Choose your brakes.",
        options: [

            [
                "Sram Force / Rival",
                "Brakes/SramForceRival.png",
                0
            ],

            [
                "Sram Red",
                "Brakes/SramRed.png",
                0
            ],

            [
                "Shimano 105",
                "Brakes/Shimano105.png",
                0
            ],

            [
                "Shimano Ultegra",
                "Brakes/ShimanoUltegra.png",
                0
            ]

        ]
    },

    {
        title: "Tires",
        description: "Choose your gravel tires.",
        options: [

            [
                "Schwalbe Thunderburt 2.1",
                "Tires/SchwalbeThunderburt.png",
                145
            ]

        ]
    },

    {
        title: "Saddle",
        description: "Choose your saddle.",
        options: [

            // Add Gravel saddle options here.

        ]
    }

];


// ======================================
// CONFIGURATOR VARIABLES
// ======================================

// -1 = Bike type selection
//  0 = First configuration step
//  6 = Configuration complete

let currentStep = -1;

let bikeType = null;

let steps = [];

let selections = [];


// ======================================
// PRICE FORMAT
// ======================================

function formatPrice(price) {

    return new Intl.NumberFormat("nl-BE", {
        style: "currency",
        currency: "EUR",
        maximumFractionDigits: 0
    }).format(price);

}


// ======================================
// GET TOTAL PRICE
// ======================================

function calculateTotal() {

    return selections.reduce((total, selection) => {

        if (!selection) return total;

        return total + selection.price;

    }, 0);

}


// ======================================
// SELECT BIKE TYPE
// ======================================

function selectBikeType(type) {

    bikeType = type;

    document.querySelectorAll(".bike-type-option").forEach(option => {

        option.classList.toggle(
            "selected",
            option.dataset.type === type
        );

    });

}


// ======================================
// START CONFIGURATION
// ======================================

function startConfiguration() {

    if (!bikeType) {

        alert("Please choose Road or Gravel first.");

        return;

    }

    // Load the correct configuration.

    steps = bikeType === "road" ? roadSteps : gravelSteps;

    // Create separate selections for the chosen bike type.

    selections = Array(steps.length).fill(null);

    currentStep = 0;

    updatePreview();

    render();

}


// ======================================
// RENDER
// ======================================

function render() {

    const content = document.getElementById("stepContent");


    // ==================================
    // BIKE TYPE SELECTION
    // ==================================

    if (currentStep === -1) {

        document.getElementById("stepIndicator").textContent =
            "STEP 01 / 01";

        document.getElementById("progress").innerHTML =
            '<span class="active"></span>';

        content.innerHTML = `

            <h1>Choose your bike</h1>

            <p class="description">
                Select your preferred bike category to start configuring.
            </p>

            <div class="options">

                <div
                    class="bike-type-option ${bikeType === "road" ? "selected" : ""}"
                    data-type="road"
                    onclick="selectBikeType('road')"
                >

                    <h3>ROAD</h3>

                    <p>Performance and speed.</p>

                </div>

                <div
                    class="bike-type-option ${bikeType === "gravel" ? "selected" : ""}"
                    data-type="gravel"
                    onclick="selectBikeType('gravel')"
                >

                    <h3>GRAVEL</h3>

                    <p>Adventure beyond the road.</p>

                </div>

            </div>

        `;

        document.getElementById("back").disabled = true;

        document.getElementById("next").style.display = "block";

        document.getElementById("next").textContent =
            "START CONFIGURING →";

        updateSummary();

        return;

    }


    // ==================================
    // CONFIGURATION COMPLETE
    // ==================================

    if (currentStep >= steps.length) {

        document.getElementById("stepIndicator").textContent =
            "CONFIGURATION COMPLETE";

        document.getElementById("progress").innerHTML =
            steps.map(() =>
                '<span class="active"></span>'
            ).join("");

        content.innerHTML = `

            <h1>Complete!</h1>

            <p class="description">
                Your ${bikeType} configuration is ready.
            </p>

            <p>Total configuration price:</p>

            <div class="completion-price">
                ${formatPrice(calculateTotal())}
            </div>

        `;

    } else {

        const step = steps[currentStep];

        document.getElementById("stepIndicator").textContent =

            `STEP ${String(currentStep + 1).padStart(2, "0")} / ${String(steps.length).padStart(2, "0")}`;


        document.getElementById("progress").innerHTML =

            steps.map((step, i) =>

                `<span class="${i <= currentStep ? "active" : ""}"></span>`

            ).join("");


        content.innerHTML = `

            <h1>${step.title}</h1>

            <p class="description">${step.description}</p>

            <div class="options">

                ${step.options.length === 0 ? `

                    <div class="empty-options">
                        Options for this step have not been added yet.
                    </div>

                ` : step.options.map((option, i) => {

                    const price = option[option.length - 1];

                    return `

                    <div
                        class="option ${
                            selections[currentStep]?.name === option[0]
                            ? "selected" : ""
                        }"
                        onclick="selectOption(${i})"
                    >

                        <img
                            src="${option[1]}"
                            alt="${option[0]}"
                        >

                        <h3>${option[0]}</h3>

                        <div class="option-price">
                            ${formatPrice(price)}
                        </div>

                    </div>

                    `;

                }).join("")}

            </div>

        `;

    }


    // ==================================
    // NAVIGATION BUTTONS
    // ==================================

    document.getElementById("back").disabled = false;

    document.getElementById("next").style.display =

        currentStep === steps.length ? "none" : "block";


    document.getElementById("next").textContent =

        currentStep === steps.length - 1
        ? "FINISH →"
        : "CONTINUE →";


    updateSummary();

}


// ======================================
// SELECT OPTION
// ======================================

function selectOption(index) {

    const option = steps[currentStep].options[index];

    const price = option[option.length - 1];

    // All images are between the name and the price.

    const images = option.slice(1, -1);

    selections[currentStep] = {

        name: option[0],

        images: images,

        price: price

    };

    updatePreview();

    render();

}


// ======================================
// CLEAR PREVIEW LAYERS
// ======================================

function clearPreview() {

    for (let i = 0; i < 6; i++) {

        const layer = document.getElementById("layer" + i);

        layer.classList.remove("visible");

        layer.removeAttribute("src");

    }

    document.getElementById("layer2b")
        .classList.remove("visible");

    document.getElementById("layer2b")
        .removeAttribute("src");

}


// ======================================
// UPDATE PREVIEW
// ======================================

function updatePreview() {

    // First hide all configurable layers.
    // This prevents images from the previous
    // configuration remaining visible.

    clearPreview();


    // Show selected images.

    selections.forEach((selection, i) => {

        if (!selection) return;

        const layer = document.getElementById("layer" + i);

        if (!layer) return;


        // First image.

        layer.src = selection.images[0];

        layer.classList.add("visible");


        // Second Groupset image.

        if (i === 2) {

            const secondLayer =
                document.getElementById("layer2b");

            if (selection.images[1]) {

                secondLayer.src = selection.images[1];

                secondLayer.classList.add("visible");

            }

        }

    });


    // Update preview status.

    const count = selections.filter(Boolean).length;

    document.getElementById("previewStatus").textContent =

        bikeType
        ? `${count} / ${steps.length} selected`
        : "Choose Road or Gravel";

}


// ======================================
// UPDATE SELECTION SUMMARY + TOTAL
// ======================================

function updateSummary() {

    const selectionList =
        document.getElementById("selectionList");


    selectionList.innerHTML =

        selections.map((selection, i) => {

            if (!selection) return "";

            return `

                <div class="summary-item">

                    <span>
                        0${i + 1} — ${selection.name}
                    </span>

                    <span>
                        ${formatPrice(selection.price)}
                    </span>

                </div>

            `;

        }).join("") || "<p>No selections yet</p>";


    // Update total price.

    document.getElementById("totalPrice").textContent =

        formatPrice(calculateTotal());

}


// ======================================
// NEXT STEP
// ======================================

function nextStep() {

    // Start after selecting Road or Gravel.

    if (currentStep === -1) {

        startConfiguration();

        return;

    }


    if (currentStep >= steps.length) return;


    if (!selections[currentStep]) {

        alert("Please select an option first.");

        return;

    }


    currentStep++;

    render();

}


// ======================================
// PREVIOUS STEP
// ======================================

function previousStep() {

    // Go to previous configuration step.

    if (currentStep > 0) {

        currentStep--;

        render();

        return;

    }


    // Return to Road / Gravel selection.

    if (currentStep === 0) {

        currentStep = -1;

        bikeType = null;

        steps = [];

        selections = [];

        clearPreview();

        updatePreview();

        render();

    }

}


// ======================================
// START CONFIGURATOR
// ======================================

render();

updatePreview();

</script>

</body>
</html>
